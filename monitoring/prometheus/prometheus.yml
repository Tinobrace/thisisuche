global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Scrape configurations
scrape_configs:
  # Monitor Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          environment: 'development'
          app: 'prometheus'

  # Monitor Node Exporter (system metrics)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          environment: 'development'
          app: 'node-exporter'

  # Monitor your portfolio app
  - job_name: 'thisisuche'
    static_configs:
      - targets: ['app:80']
        labels:
          environment: 'development'
          app: 'thisisuche'